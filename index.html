<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primera Práctica - Ariadne Vargas Galindo</title>
    <style>
        body {
            background-color: #40E0D0; /* Azul turquesa */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            border: 4px solid #00B5AD;
        }
        h1 {
            color: #008B8B;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        p {
            color: #444444;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .nombre {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 18px;
            background-color: #E0F7FA;
            color: #00796B;
            font-weight: bold;
            border-radius: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola Mundo! ✨</h1>
        <p>Esta es mi primera práctica.</p>
        <div class="nombre">Ariadne</div>
    </div>
</body>
</html>
